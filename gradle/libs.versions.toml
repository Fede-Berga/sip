[versions]
spring-boot              = "4.1.2"
spring-dependency-mgmt   = "1.1.7"
testcontainers           = "1.21.4"
mapstruct                = "1.6.3"
lombok                   = "1.18.48"

[libraries]
spring-boot-starter-web        = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa   = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security   = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2     = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-kafka      = { module = "org.springframework.kafka:spring-kafka" }
spring-boot-starter-redis      = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-actuator   = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test       = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter            = { module = "org.springframework.boot:spring-boot-starter" }
junit-bom                      = { module = "org.junit:junit-bom",             version = "6.1.3" }
junit-jupiter                  = { module = "org.junit.jupiter:junit-jupiter"                    }
junit-launcher                 = { module = "org.junit.platform:junit-platform-launcher"         }
liquibase                      = { module = "org.liquibase:liquibase-core" }
jackson                        = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-jsr310                 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
liquibase-spring               = { module = "org.liquibase:liquibase-core" }


testcontainers-junit     = { module = "org.testcontainers:junit-jupiter",  version.ref = "testcontainers" }
testcontainers-postgres  = { module = "org.testcontainers:postgresql",     version.ref = "testcontainers" }
testcontainers-kafka     = { module = "org.testcontainers:kafka",          version.ref = "testcontainers" }

mapstruct                = { module = "org.mapstruct:mapstruct",           version.ref = "mapstruct" }
mapstruct-processor      = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok                   = { module = "org.projectlombok:lombok",          version.ref = "lombok" }

[plugins]
spring-boot                  = { id = "org.springframework.boot",          version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management",   version.ref = "spring-dependency-mgmt" }
