spring:
  application:
    name: sip

  # Virtual threads — abilita globalmente per tutti i request handler
  threads:
    virtual:
      enabled: true

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/sip
    username: sip
    password: sip
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sip-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always

# SIP custom properties
sip:
  alerts:
    webhook-url: ""            # Lascia vuoto per disabilitare gli alert

# Logging
logging:
  level:
    dev.sip: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE